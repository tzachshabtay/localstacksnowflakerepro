version: "3.8"

services:
  snowflakerepro:
    container_name: "snowflakerepro"
    image: localstack/snowflake:latest@sha256:f81ccea6a3ca7f37901c244cdf6b0d3571f73e653259b875b67b1e9a13e20ef6
    networks:
      local:
        aliases:
          - snowflake.localhost.localstack.cloud
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
      - "127.0.0.1:443:443"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - DOCKER_FLAGS='-e SF_LOG=trace'
      - DEBUG=1
      - IMAGE_NAME=localstack/snowflake
    volumes:
      - "./volume:/var/lib/localstack"
networks:
  local:
    external: true
